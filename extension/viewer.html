<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Tracker v2 scrape</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1c1d1f; --muted: #6b6f76; --line: #e1e2e4;
    --head: #f0f1f2; --accent: #1d5fd1; --new: #fff6d6; --ok: #1a7f37; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #e8e9eb; --muted: #9a9ea6; --line: #2c2e33;
            --head: #202226; --accent: #6ea0ff; --new: #3a3417; --ok: #3fb950; --bad: #f85149; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         display: flex; flex-direction: column; overflow: hidden;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { flex: none; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 10px 14px;
           display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header .status { color: var(--muted); margin-left: auto; max-width: 48%; text-align: right; }
  .sync { flex: none; border-bottom: 1px solid var(--line); padding: 8px 14px;
          display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; }
  .sync label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .sync input[type="text"], .sync input[type="password"] { width: 260px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  button, input { font: inherit; color: inherit; background: var(--bg);
                  border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type="number"] { width: 64px; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { flex: 1; min-height: 0; overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 820px; }
  th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; z-index: 1; background: var(--head); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.time { white-space: nowrap; color: var(--muted); }
  td.post { min-width: 320px; white-space: pre-wrap; word-break: break-word; }
  td.user .h { color: var(--muted); display: block; }
  tr.new { background: var(--new); }
  a { color: var(--accent); }
  .empty { padding: 40px 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <button id="toggle">Start</button>
  <label>Refresh every <input id="secs" type="number" min="15" step="5" value="30"> sec</label>
  <button id="csv">Export CSV</button>
  <button id="clear">Clear</button>
  <span class="status" id="status"></span>
</header>
<div class="sync">
  <label><input id="syncOn" type="checkbox" checked> Push to xtracker-v2</label>
  <label>Ingest URL <input id="ingestUrl" type="text" value="http://127.0.0.1:8081/api/ingest"></label>
  <label>Secret <input id="ingestSecret" type="password" placeholder="optional"></label>
  <button id="syncNow">Sync now</button>
  <span id="syncStatus" class="status"></span>
</div>
<div class="wrap">
  <table id="tbl" hidden>
    <thead><tr>
      <th>Posted</th><th>Account</th><th>Alert / post</th>
      <th>Replies</th><th>Reposts</th><th>Likes</th><th>Link</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
<p class="empty" id="empty">Open x.com/home or x.com/notifications, load this unpacked extension, Start, and run <code>python xtracker.py --plugin --now</code> in xtracker-v2.</p>
<script src="viewer.js"></script>
</body>
</html>
